name: Paquete para Google Play (AAB)

# Se lanza a mano: Actions → "Paquete para Google Play (AAB)" → Run workflow.
# El archivo calderilla.aab aparece al final, en "Artifacts", listo para subirlo a Play Console.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias (sin ejecutar scripts de terceros)
        run: |
          npm ci --ignore-scripts
          npx --no-install patch-package
      - run: npm test
      - run: unzip -q -o android.zip
      - run: npx --no-install cap sync android
      - name: Preparar la clave de firma (clave de subida de Play)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/calderilla.keystore
      - name: Compilar AAB firmado
        working-directory: android
        env:
          CALDERILLA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Empieza en 1001 para ir siempre por encima de las versiones del APK
          export VERSION_CODE=$((1000 + ${{ github.run_number }}))
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab ../calderilla.aab
      - name: Borrar la clave de firma del disco
        if: always()
        run: rm -f android/app/calderilla.keystore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calderilla-aab
          path: calderilla.aab
          retention-days: 7
